<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기분에 따른 노래추천 - MOOD</title>
  
  <!-- 카카오톡 공유 시 표시되는 오픈그래프(OG) 메타태그 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MOOD - 기분에 따른 노래추천">
  <meta property="og:description" content="오늘 당신의 기분에 딱 맞는 K-pop과 인디 음악을 추천해드립니다.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800">

  <style>
    /* 전체 스타일 정의 */
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary-color: #8a70d6;
      --primary-hover: #7353c8;
      --accent-lavender: #ece7f8;
      --text-main: #333333;
      --text-sub: #666666;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 24px rgba(138, 112, 214, 0.12);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 36px 28px;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* 헤더 영역 */
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    header p.sub-title {
      font-size: 0.98rem;
      color: var(--text-sub);
      margin-bottom: 28px;
      line-height: 1.4;
    }

    /* 기분 선택 화면 */
    .question {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #444;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    .mood-btn {
      background-color: #faf9fe;
      border: 2px solid var(--accent-lavender);
      border-radius: 14px;
      padding: 20px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mood-btn:hover {
      background-color: var(--accent-lavender);
      transform: translateY(-2px);
    }

    .mood-btn .emoji {
      font-size: 2rem;
    }

    .mood-btn .label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* 음악 추천 화면 */
    .music-card {
      display: none;
      background: #ffffff;
      border: 1px solid var(--accent-lavender);
      border-radius: var(--radius);
      padding: 28px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .song-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 6px;
      word-break: keep-all;
    }

    .artist-name {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--primary-color);
      margin-bottom: 18px;
    }

    .meta-tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .tag {
      background-color: var(--accent-lavender);
      color: var(--primary-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* 버튼 그룹 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }

      background-color: #FF0000;
      color: #ffffff;
