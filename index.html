    <!-- 푸터 (카톡 공유 버튼 및 토스트 메시지) -->
    <footer class="w-full max-w-xl mx-auto px-5 pb-8 text-center">
        <div class="pt-6 border-t border-gray-200/60 flex flex-col items-center gap-3">
            <button onclick="handleShareClick()" class="inline-flex items-center gap-2 px-4 py-2.5 bg-amber-100 hover:bg-amber-200 active:bg-amber-300 text-amber-900 rounded-full text-xs sm:text-sm font-semibold transition-colors shadow-sm">
                <svg class="w-4 h-4 fill-current text-amber-800" viewBox="0 0 24 24">

    <!-- 카카오톡 공유/배포 URL 모달 -->
    <div id="share-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden fade-in">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-left shadow-2xl border border-gray-100">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                    <span>🔗</span> 카카오톡 공유 링크
                </h3>
                <button onclick="closeShareModal()" class="text-gray-400 hover:text-gray-600 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <p class="text-xs text-gray-500 mb-4 leading-relaxed">
                GitHub Pages 배포 후 생성된 본인의 웹사이트 주소를 확인 및 복사하여 카카오톡에 전송해 보세요!
            </p>

            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-600 mb-1">공유할 웹사이트 URL</label>
                <div class="flex gap-2">
                    <input type="text" id="share-url-input" class="w-full text-xs p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-400 text-gray-700" readonly />
                </div>
            </div>

            <div class="space-y-2">
                <button onclick="copyShareUrl()" class="w-full py-3 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white font-bold rounded-xl text-sm transition-colors flex items-center justify-center gap-1.5 shadow-md shadow-brand-200">
                    <span>📋</span> 링크 복사하기
                </button>
                <button onclick="closeShareModal()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold rounded-xl text-xs transition-colors">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <!-- 링크 복사 성공 알림 토스트 -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-5 py-2.5 rounded-full text-sm font-medium shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-2">
        <span>✨</span> <span id="toast-message">링크가 복사되었습니다! 카톡에 공유해보세요.</span>
    </div>

    <!-- JavaScript 로직 -->
    <script>
<!-- ... existing code ... -->
        // 토스트 메시지 출력
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // 공유 버튼 클릭 스마트 처리
        function handleShareClick() {
            const currentUrl = window.location.href;
            const shareUrlInput = document.getElementById('share-url-input');

            // 미리보기 환경이나 로컬 환경인지 확인
            const isPreviewOrLocal = currentUrl.includes('googleusercontent') || 
                                     currentUrl.includes('localhost') || 
                                     currentUrl.startsWith('file://') ||
                                     currentUrl.includes('blob:');

            if (isPreviewOrLocal) {
                // 임시 환경인 경우 안내 메세지와 함께 모달 출력
                shareUrlInput.removeAttribute('readonly');
                shareUrlInput.value = "https://your-username.github.io/repository-name";
                shareUrlInput.placeholder = "GitHub Pages 배포 주소를 입력하세요";
                document.getElementById('share-modal').classList.remove('hidden');
            } else {
                // 실제 배포된 웹사이트인 경우 현 URL 복사/공유
                shareUrlInput.setAttribute('readonly', 'readonly');
                shareUrlInput.value = currentUrl;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'MOOD - 기분에 따른 노래추천',
                        text: '오늘의 기분에 맞는 음악을 찾아보세요!',
                        url: currentUrl,
                    }).catch(() => {
                        // 공유창 취소 시 모달 열기
                        document.getElementById('share-modal').classList.remove('hidden');
                    });
                } else {
                    document.getElementById('share-modal').classList.remove('hidden');
                }
            }
        }

        // 모달 닫기
        function closeShareModal() {
            document.getElementById('share-modal').classList.add('hidden');
        }

        // 모달에서 URL 복사하기
        function copyShareUrl() {
            const shareUrlInput = document.getElementById('share-url-input');
            const targetText = shareUrlInput.value.trim();

            if (!targetText) {
                showToast('올바른 URL을 입력해주세요.');
                return;
            }

            // 클립보드 복사
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(targetText).then(() => {
                    showToast('링크가 복사되었습니다! 카톡에 붙여넣어 공유해보세요.');
                    closeShareModal();
                }).catch(() => {
                    fallbackCopyText(targetText);
                });
            } else {
                fallbackCopyText(targetText);
            }
        }

        // 구형/Iframe fallback 복사 함수
        function fallbackCopyText(text) {
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            try {
                document.execCommand('copy');
                showToast('링크가 복사되었습니다! 카톡에 붙여넣어 공유해보세요.');
                closeShareModal();
            } catch (err) {
                showToast('복사에 실패했습니다. 주소를 직접 선택하여 복사해주세요.');
            } finally {
                document.body.removeChild(dummy);
            }
        }
    </script>
